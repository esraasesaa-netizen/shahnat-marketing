/* Light only, Tajawal throughout. Layout: an office floor plan. The manager's desk sits on top, five rooms with door gaps sit below it (plus the meeting room), and a bottom bar switches between floor, task board and weekly meeting. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#13213C; --muted:#56647F; --line:#D8DEEA; --soft:#E8ECF4;
  --navy:#243A4B; --navy-ink:#FFFFFF; --outline:#243A4B;
  --accent:#C24C06; --bright:#F85F22; --accent-ink:#FFFFFF; --accent-text:#B34505;
  --s-new:#56647F; --s-new-bg:#E8ECF4;
  --s-doing:#2459C7; --s-doing-bg:#E3ECFC;
  --s-review:#B34505; --s-review-bg:#FDEBDD;
  --s-done:#17724B; --s-done-bg:#DDF3E8;
  --bad:#B3261E;
  --display:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 100px}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 16px}
.top h1{font:700 27px/1.25 var(--display);margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.mini{min-height:40px;padding:0 14px;border:1.5px solid var(--outline);background:transparent;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}

/* desk */
.desk{background:var(--navy);color:var(--navy-ink);padding:18px;border-radius:6px;display:grid;gap:14px}
.desk h2{font:700 19px var(--display);margin:0}
.desk .sub{margin:0;font-size:13.5px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 6px;background:rgba(255,255,255,.09);text-align:center;border-radius:4px}
.stat b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;opacity:.9}
.prog{display:grid;gap:6px;font-size:13.5px}
.prog .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:#FF9B57}
.focus{display:grid;gap:8px}
.focus h3{margin:0;font-size:13.5px;font-weight:700;opacity:.85}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;background:rgba(255,255,255,.09);border:0;border-radius:4px;padding:10px 12px;color:var(--navy-ink);cursor:pointer;min-height:46px}
.fitem span:first-child{min-width:0;overflow-wrap:anywhere;font-weight:500}
.fitem small{flex:none;font-size:12.5px;opacity:.85}

.nudge{margin:14px 0 0;padding:12px 14px;border:1.5px dashed var(--accent-text);border-radius:4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14.5px}

h2.sec{font:700 19px var(--display);margin:26px 0 12px}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.room{position:relative;background:var(--surface);border:2px solid var(--outline);border-radius:3px;padding:14px 12px 22px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:158px;cursor:pointer;width:100%;min-width:0}
.room::after{content:"";position:absolute;bottom:-2px;left:50%;width:36px;height:6px;margin-left:-18px;background:var(--bg)}
.room::before{content:"";position:absolute;bottom:2px;left:50%;margin-left:18px;width:2px;height:15px;background:var(--accent);transform-origin:bottom;transform:rotate(-24deg)}

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

var weekStart=new Date();weekStart.setHours(0,0,0,0);weekStart.setDate(weekStart.getDate()-weekStart.getDay());
var weekStartISO=weekStart.toISOString();
function dparse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var LOC='ar-SA-u-ca-gregory';
function fmtShort(s){return dparse(s).toLocaleDateString(LOC,{day:'numeric',month:'long'})}
function fmtLong(iso){return new Date(iso).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'})}
function dueLabel(due){
  if(!due)return '';
  var diff=Math.round((dparse(due)-dparse(todayStr))/86400000);
  if(diff===0)return 'اليوم';
  if(diff===1)return 'غدًا';
  return fmtShort(due);
}
function isLate(t){return !!t.due&&t.status!=='done'&&t.due<todayStr}

function md(src){
  var lines=String(src||'').replace(/\r/g,'').split('\n'),html='',list=null,para=[];
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
  function fp(){if(para.length){html+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}}
  function fl(){if(list){html+='</'+list+'>';list=null}}
  for(var i=0;i<lines.length;i++){
    var l=lines[i].replace(/\s+$/,''),m;
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){fp();fl();var lv=Math.min(m[1].length+1,4);html+='<h'+lv+'>'+inl(m[2])+'</h'+lv+'>';continue}
    if(/^\s*[-*•]\s+/.test(l)){fp();if(list!=='ul'){fl();html+='<ul>';list='ul'}html+='<li>'+inl(l.replace(/^\s*[-*•]\s+/,''))+'</li>';continue}
    if(/^\s*\d+[.)]\s+/.test(l)){fp();if(list!=='ol'){fl();html+='<ol>';list='ol'}html+='<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>';continue}
    if(/^-{3,}$/.test(l.trim())){fp();fl();html+='<hr>';continue}
    fl();para.push(l);
  }
  fp();fl();return html;
}

function keepSnap(){

  });

}
function keepRestore(m){

    var el=document.getElementById(id);if(!el)return;var x=m[id];
    if(el.type==='checkbox'||el.type==='radio')el.checked=x.v;else el.value=x.v;
    if(x.f){el.focus();try{el.setSelectionRange(x.s,x.e)}catch(_){}}

}

function roomStat(k){

  if(c.new)return {cls:'',txt:n(c.new)+' مهام جديدة لم تبدأ'};
  return {cls:'done',txt:'متفرغ لمهمة جديدة'};

function sortTasks(l){
  var order={review:0,doing:1,'new':2,done:3};
  return l.slice().sort(function(a,b){
    var oa=order[a.status],ob=order[b.status];
    if(oa!==ob)return oa-ob;
    if(a.status==='done')return (a.doneAt||'')<(b.doneAt||'')?1:-1;
    return (a.due||'9')<(b.due||'9')?-1:1;
  });
}

  return h;

function cleanMeeting(d){
  function s(x,m){return String(x==null?'':x).slice(0,m)}
  function arr(x,m,l){return (Array.isArray(x)?x:[]).slice(0,l).map(function(v){return s(v,m)}).filter(Boolean)}
  d=d||{};
  var emps=(Array.isArray(d.employees)?d.employees:[]).filter(function(r){return r&&EMP[r.key]}).map(function(r){return {key:r.key,report:s(r.report,500),blocker:s(r.blocker,300),idea:s(r.idea,300)}});
  var next=(Array.isArray(d.next)?d.next:[]).filter(function(t){return t&&EMP[t.emp]&&t.title}).slice(0,6).map(function(t){
    var days=Number(t.due_in_days);var due='';
    if(isFinite(days)&&days>=0&&days<=30){var dt=new Date();dt.setDate(dt.getDate()+Math.round(days));due=ymd(dt)}
    return {emp:t.emp,title:s(t.title,140),brief:s(t.brief,700),priority:t.priority==='high'?'high':'normal',due:due};
  });
  return {headline:s(d.headline,240),employees:emps,gaps:arr(d.gaps,320,5),improve:arr(d.improve,320,5),next:next};
}

function dueRun(t){
  if(!t.auto||t.status!=='new'||!t.due||state.err[t.id])return false;
  var p=t.due.split('-'),tm=(t.dueTime||'08:00').split(':');
  return new Date(+p[0],+p[1]-1,+p[2],+tm[0],+tm[1])<=new Date();

function autoRun(){

  var c=Object.keys(state.running).length;

async function runTask(id,note,fb){
  var t=getTask(id,fb);
  if(!t||state.running[id])return;
  if(!sample){toast('تشغيل الموظفين غير متاح في هذا العرض');return}
  var prevStatus=t.output?'review':'new';
  var ctl=new AbortController();
  state.running[id]={text:'',ctl:ctl};state.err[id]='';
  render();
  await patch(id,{status:'doing'});
  try{
    var r=await sample(buildTaskPrompt(t,note),{signal:ctl.signal,cache:false,onText:function(u){
      if(state.running[id])state.running[id].text=u.text;
      var el=document.getElementById('live-'+id);if(el)el.innerHTML=md(u.text);
    }});
    await patch(id,{output:r.text,status:'review',truncated:!!r.truncated,revisions:(t.revisions||0)+(note?1:0),lastRunAt:now()});addAlert('task_ready',id,(EMP[t.emp]||{n:''}).n+' سلّم: '+t.title);
  }catch(e){
    if(e&&e.code!=='cancelled')state.err[id]=sampleErr(e&&e.code);
    await patch(id,{status:prevStatus});
  }finally{
    delete state.running[id];render();
  }
}
async function createTask(){
  var v=function(i){var el=document.getElementById(i);return el?el.value:''};
  var title=v('nt-title').trim();
  if(!title){toast('اكتبي عنوان المهمة');return}
  var go=!!(document.getElementById('nt-go')&&document.getElementById('nt-go').checked&&sample);
  var data={title:title,brief:v('nt-brief').trim(),emp:v('nt-emp'),priority:v('nt-prio')==='high'?'high':'normal',due:v('nt-due')||'',dueTime:v('nt-time')||'08:00',auto:!go&&!!v('nt-due'),
    status:'new',createdAt:now(),updatedAt:now(),output:'',attachments:[],revisions:0};
  if(data.auto){data.prompt=buildTaskPrompt(data,'');data.empName=(EMP[data.emp]||{}).n||''}
  var ref=db.collection('tasks').doc();
  try{await ref.set(data)}catch(e){console.error(e);toast('تعذر حفظ المهمة');return}
  state.view='tasks';
  state.sheet={type:'task',id:ref.id};
  render();
  if(go)runTask(ref.id,'',Object.assign({id:ref.id},data));
}
function addLesson(k,text){
  return enqueue('e'+k,function(){var cur=(state.emps[k]&&state.emps[k].lessons)||[];return db.doc('employees/'+k).set({lessons:cur.concat([text]).slice(-20)})}).catch(function(e){console.error(e);toast('تعذر حفظ التوجيه')});
}
async function uploadFiles(files,id){
  if(!assets||!files.length)return;
  state.uploading=true;render();
  var t=getTask(id),list=((t&&t.attachments)||[]).slice();
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var r=await assets.upload(f,typeOf(f));
      list.push({id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes,at:now()});
    }catch(e){
      var c=e&&e.code,m={unsupported_type:'الصيغة غير مدعومة: '+f.name,too_large:'الملف أكبر من ٢٠ ميغابايت: '+f.name,quota_or_state:'مساحة المرفقات امتلأت'};
      toast(m[c]||'تعذر رفع '+f.name);
    }
  }
  await patch(id,{attachments:list});
  state.uploading=false;render();
}
function buildMinutes(m,notes){
  var d=m.data||{},L=[];
  L.push('محضر اجتماع المكتب التسويقي لمنصة شحنات');
  L.push('التاريخ: '+fmtLong(m.at));
  L.push('الحضور: المدير التنفيذي، مديرة المكتب التسويقي، '+EMPS.map(function(e){return e.n}).join('، ')+' (الموظفون الأذكياء)');
  if(d.headline)L.push('\nملخص الاجتماع:\n'+d.headline);
  var rep=(d.employees||[]).filter(function(r){return EMP[r.key]});
  if(rep.length){L.push('\nما جرى في الاجتماع (تقارير الفريق):');rep.forEach(function(r){var e=EMP[r.key];L.push('- '+e.n+' ('+e.role+'): '+(r.report||'—')+(r.blocker?' | يعطّله: '+r.blocker:'')+(r.idea?' | فكرة تطوير: '+r.idea:''))})}
  if((d.gaps||[]).length){L.push('\nنقاط التقصير:');d.gaps.forEach(function(x){L.push('- '+x)})}
  if((d.improve||[]).length){L.push('\nنقاط التطوير:');d.improve.forEach(function(x){L.push('- '+x)})}
  if((d.next||[]).length){L.push('\nالمهام المقترحة للأسبوع القادم'+(m.added?' (أُضيفت إلى لوحة المهام)':'')+':');d.next.forEach(function(t){L.push('- '+t.title+' — '+((EMP[t.emp]||{}).n||'؟')+(t.priority==='high'?' (عاجلة)':''))})}
  L.push('\nقرارات وملاحظات المدير التنفيذي:\n'+((notes||'').trim()||'لا توجد ملاحظات مدوّنة.'));
  return L.join('\n');
}
async function startMeeting(){

  function fail(e){state.dbErr=(e&&e.code)||'error';render()}
  db.collection('tasks').onSnapshot(function(s){
    state.tasks=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    state.ready.t=true;clearTimeout(timer);render();
  },fail);
  db.collection('employees').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=d.data()});state.emps=m;state.ready.e=true;render();
  },fail);
  db.collection('meetings').onSnapshot(function(s){
    state.meetings=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});state.ready.m=true;render();
  },fail);
  if(state.mgr){
    db.collection('notes').onSnapshot(function(s){state.notes=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},fail);
    db.collection('alerts').onSnapshot(function(s){
      var list=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      if(alertsReady)list.forEach(function(a){if(!a.read&&!alertIds[a.id])notify(a)});
      alertIds={};list.forEach(function(a){alertIds[a.id]=1});
      state.alerts=list;alertsReady=true;render();
    },fail);
  }
  if(!state.mgr){
    var seenMin=null;
    db.collection('alerts').onSnapshot(function(s){
      var ids={};s.docs.forEach(function(d){ids[d.id]=d.data()});
      if(seenMin){Object.keys(ids).forEach(function(k){if(!seenMin[k]&&ids[k].type==='minutes'&&ids[k].text)notify(ids[k])})}
      seenMin=Object.keys(ids).reduce(function(o,k){o[k]=1;return o},{});
    },fail);
  }
  db.doc('config/company').onSnapshot(function(d){
    state.company=d.exists?String((d.data()||{}).text||''):'';state.ready.c=true;render();
  },fail);
  setInterval(autoRun,60000);setTimeout(autoRun,2500);
})();
})();
</script>

</body></html>
