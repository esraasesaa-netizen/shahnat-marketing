<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#243A4B">
<title>المكتب التسويقي | شحنات</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/tajawal-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/fonts/tajawal-700.woff" as="font" type="font/woff" crossorigin>
<style>
[hidden]:not([hidden=until-found i]){display:none!important}
img{max-width:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@font-face{font-family:'Sakkal';src:local('Sakkal Majalla'),local('SakkalMajalla');font-weight:400;size-adjust:128%;font-display:swap}
@font-face{font-family:'Sakkal';src:local('Sakkal Majalla Bold'),local('SakkalMajalla-Bold'),local('Sakkal Majalla');font-weight:700 800;size-adjust:128%;font-display:swap}
@font-face{font-family:'Tajawal';font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/tajawal-400.woff) format('woff')}
@font-face{font-family:'Tajawal';font-weight:500;font-style:normal;font-display:swap;src:url(/fonts/tajawal-500.woff) format('woff')}
@font-face{font-family:'Tajawal';font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/tajawal-700.woff) format('woff')}
@font-face{font-family:'Tajawal';font-weight:800;font-style:normal;font-display:swap;src:url(/fonts/tajawal-800.woff) format('woff')}
/* Light only. Font: Sakkal Majalla where installed, Tajawal elsewhere. Layout: an office floor plan. The manager's desk sits on top, five rooms with door gaps sit below it (plus the meeting room), and a bottom bar switches between floor, task board and weekly meeting. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#13213C; --muted:#56647F; --line:#D8DEEA; --soft:#E8ECF4;
  --navy:#243A4B; --navy-ink:#FFFFFF; --outline:#243A4B;
  --accent:#C24C06; --bright:#F85F22; --accent-ink:#FFFFFF; --accent-text:#B34505;
  --s-new:#56647F; --s-new-bg:#E8ECF4;
  --s-doing:#2459C7; --s-doing-bg:#E3ECFC;
  --s-review:#B34505; --s-review-bg:#FDEBDD;
  --s-done:#17724B; --s-done-bg:#DDF3E8;
  --bad:#B3261E;
  --display:'Sakkal','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Sakkal','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 100px}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0 16px}
.top h1{font:700 27px/1.25 var(--display);margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.mini{min-height:40px;padding:0 14px;border:1.5px solid var(--outline);background:transparent;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}

/* desk */
.desk{background:var(--navy);color:var(--navy-ink);padding:18px;border-radius:6px;display:grid;gap:14px}
.desk h2{font:700 19px var(--display);margin:0}
.desk .sub{margin:0;font-size:13.5px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 6px;background:rgba(255,255,255,.09);text-align:center;border-radius:4px}
.stat b{display:block;font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;opacity:.9}
.prog{display:grid;gap:6px;font-size:13.5px}
.prog .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:#FF9B57}
.focus{display:grid;gap:8px}
.focus h3{margin:0;font-size:13.5px;font-weight:700;opacity:.85}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;background:rgba(255,255,255,.09);border:0;border-radius:4px;padding:10px 12px;color:var(--navy-ink);cursor:pointer;min-height:46px}
.fitem span:first-child{min-width:0;overflow-wrap:anywhere;font-weight:500}
.fitem small{flex:none;font-size:12.5px;opacity:.85}

.nudge{margin:14px 0 0;padding:12px 14px;border:1.5px dashed var(--accent-text);border-radius:4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14.5px}

h2.sec{font:700 19px var(--display);margin:26px 0 12px}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.room{position:relative;background:var(--surface);border:2px solid var(--outline);border-radius:3px;padding:14px 12px 22px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:158px;cursor:pointer;width:100%;min-width:0}
.room:hover{border-color:var(--accent)}
.room.meet{background:transparent;border-style:dashed}
.rtag{font:600 12.5px var(--display);color:var(--muted);letter-spacing:.04em}
.rname{font:700 21px/1.2 var(--display)}
.rrole{font-size:13.5px;color:var(--muted);line-height:1.4}
.rstate{margin-top:auto;padding-top:8px;display:flex;gap:7px;align-items:flex-start;font-size:13px;font-weight:500;line-height:1.35}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--s-new)}
.dot.doing{background:var(--s-doing)}.dot.review{background:var(--accent)}.dot.done{background:var(--s-done)}
.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.note{margin:26px 0 0;font-size:13.5px;color:var(--muted);line-height:1.7}

/* tasks */
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
.rowhead h2{font:700 21px var(--display);margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;min-height:38px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:4px;text-align:start;width:100%;cursor:pointer}
.task:hover{border-color:var(--outline)}
.task .tt{font-weight:700;overflow-wrap:anywhere}
.task .tm{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.late{color:var(--bad);font-weight:700}
.hot{color:var(--accent-text);font-weight:700}
.pill{font-size:12.5px;font-weight:700;padding:2px 11px;border-radius:99px;white-space:nowrap;display:inline-block}
.p-new{background:var(--s-new-bg);color:var(--s-new)}
.p-doing{background:var(--s-doing-bg);color:var(--s-doing)}
.p-review{background:var(--s-review-bg);color:var(--s-review)}
.p-done{background:var(--s-done-bg);color:var(--s-done)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:4px}

/* buttons and forms */
.btn{font-weight:700;min-height:48px;padding:0 20px;border-radius:4px;border:2px solid var(--outline);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);min-height:40px;padding:0 10px}
.btn.danger{border-color:transparent;background:transparent;color:var(--bad);min-height:40px}
.btn[disabled]{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:grid;gap:6px;font-weight:700;font-size:14.5px}
input,textarea,select{font:inherit;font-size:16px;font-weight:400;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-height:46px}
textarea{min-height:130px;resize:vertical;line-height:1.7}
.form{display:grid;gap:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpls .chip{white-space:normal;text-align:start;line-height:1.35;padding:7px 12px}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:22px;height:22px;min-height:0;flex:none}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.sin{max-width:720px;margin:0 auto;padding-bottom:56px}
.shead{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .x{min-height:44px;padding:0 14px;border:1.5px solid var(--outline);border-radius:4px;background:transparent;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.who{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.av{width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font:700 26px var(--display);flex:none}
.who h2{font:700 24px/1.2 var(--display);margin:0}
.who p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.block{margin:20px 0 0;display:grid;gap:10px}
.block>h3{font:700 17px var(--display);margin:0}
.paper{background:var(--surface);border:1px solid var(--line);padding:16px;border-radius:4px;overflow-wrap:anywhere}
.paper>*:first-child{margin-top:0}.paper>*:last-child{margin-bottom:0}
.md h2,.md h3,.md h4{font-family:var(--display);margin:18px 0 6px;line-height:1.35}
.md h2{font-size:20px}.md h3{font-size:18px}.md h4{font-size:16px}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-inline-start:24px}.md li{margin:3px 0}
.md code{background:var(--soft);padding:1px 6px;border-radius:3px;font-size:.92em}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.typing::after{content:"";display:inline-block;width:8px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-inline-start:4px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.brief{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.err{color:var(--bad);font-size:14.5px;margin:0}
.atts{display:grid;gap:10px}
.att{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.att a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.att img{width:52px;height:52px;object-fit:cover;border-radius:3px;flex:none;background:var(--soft)}
.att .ic{width:52px;height:52px;flex:none;border-radius:3px;background:var(--soft);display:grid;place-items:center;font:700 12px var(--display);color:var(--muted)}
.att .nm{min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.att small{display:block;color:var(--muted)}
.lessons{display:grid;gap:8px}
.lesson{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.lesson span{min-width:0;overflow-wrap:anywhere}

/* meeting */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;display:grid;gap:6px}
.mcard h4{margin:0;font:700 17px var(--display)}
.mcard p{margin:0;font-size:15px}
.mcard .k{font-size:12.5px;font-weight:700;color:var(--accent-text)}
.mlist{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.sel{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px}
.sel input{width:22px;height:22px;min-height:0;flex:none;margin-top:3px}
.sel b{display:block}
.sel small{color:var(--muted)}
.headline{font:700 20px/1.5 var(--display);margin:6px 0 0}
.hist{display:grid;gap:8px}
.hist button{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;text-align:start;cursor:pointer;display:grid;gap:2px;min-height:48px}
.hist button[aria-current="true"]{border-color:var(--accent);border-width:2px}
.hist small{color:var(--muted)}

/* bottom bar */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.bar button{flex:1;border:0;background:transparent;min-height:54px;display:grid;place-items:center;align-content:center;gap:2px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:4px}
nav.bar button[aria-current="page"]{color:var(--accent-text);font-weight:800;background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:4px;z-index:60;max-width:calc(100% - 32px);font-size:14.5px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.typing::after,.dot.pulse{animation:none}}
@media (max-width:360px){.rooms{gap:12px 10px}.rname{font-size:19px}}
/* brand */
.top{border-bottom:3px solid var(--bright);margin-bottom:14px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;min-width:56px;height:56px;padding:6px 10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center}
.logo img{max-height:42px;max-width:96px;object-fit:contain}
.logo .wm{font:800 22px var(--display);color:var(--navy)}
.top h1{font-size:21px}
.desk{border-top:4px solid var(--bright)}
.ceo{display:flex;gap:12px;align-items:center;background:var(--navy);color:var(--navy-ink);border-radius:6px;padding:12px 14px;margin:0 0 14px;border-top:4px solid var(--bright)}
.ceo .av{background:var(--bright);color:#fff;width:46px;height:46px;font-size:22px}
.ceo b{display:block;font:700 17px var(--display)}.ceo small{opacity:.85;line-height:1.5;display:block}
.notes{display:grid;gap:10px;margin-top:16px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.ncard.pinned{border-color:var(--bright);border-width:2px}
.ncard p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.nmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nmeta small{color:var(--muted)}
.wrap{max-width:1180px}
.logo{height:76px;min-width:76px}.logo img{max-height:60px;max-width:190px}
.top h1{font-size:24.5px}
.sin{max-width:920px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.mini{min-height:46px;display:inline-flex;align-items:center}
.badge{background:var(--bright);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;margin-inline-start:8px}
.hist button.unr{border-color:var(--bright);border-width:2px}
@media(min-width:900px){
 body{padding-left:48px;padding-right:48px}
 .rooms{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
 .room{min-height:200px;padding:18px 16px 26px}
 .tasks{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats{gap:14px}.desk{padding:26px}
 nav.bar{left:50%;right:auto;transform:translateX(-50%);width:min(640px,92vw);bottom:14px;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(14,42,90,.18)}
}
.top{flex-wrap:wrap}
.ri{display:inline-grid;width:44px;height:44px;place-items:center;border-radius:12px;background:var(--soft);color:var(--bright);margin-bottom:6px}
.ri svg{width:26px;height:26px}
.room{transition:transform .2s,border-color .2s}.room:hover{transform:translateY(-3px)}
@keyframes float{50%{transform:translateY(-5px)}}
.ceo-ic{margin-inline-start:auto;display:flex;gap:10px}
.fl{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.fl:nth-child(2){animation-delay:-1s}.fl:nth-child(3){animation-delay:-2s;color:var(--bright)}
.fl svg{width:20px;height:20px}
.scene{height:92px;margin:0 0 14px;border-radius:8px;overflow:hidden;background:linear-gradient(#EAF1F8,#F7FAFD);border:1px solid var(--line)}
.scene svg{width:100%;height:100%;display:block}
.scene .cloud ellipse{fill:#fff}
.scene .cloud{animation:drift 26s linear infinite}.scene .c2{animation-duration:34s;animation-delay:-12s}
.scene .box rect,.scene .box path{fill:none;stroke:var(--bright);stroke-width:2}
.scene .box{animation:float 3s ease-in-out infinite}.scene .b2{animation-delay:-1s}.scene .b3{animation-delay:-2s}
.scene .road{stroke:var(--navy);stroke-width:3;stroke-dasharray:16 12;animation:dash 1s linear infinite;fill:none}
.scene .sp{stroke:var(--bright);stroke-width:3;stroke-linecap:round;fill:none;opacity:.6}
.scene .truck{animation:drive 9s linear infinite}
.scene .truck{transform-box:fill-box}
@keyframes drive{from{transform:translateX(-130px)}to{transform:translateX(720px)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(640px)}}
@media(prefers-reduced-motion:reduce){.ri,.fl,.scene *{animation:none!important}}
@media(max-width:600px){
 .top{flex-direction:column;align-items:stretch;gap:10px}
 .top h1{font-size:20px}
 .logo{height:56px;min-width:56px}.logo img{max-height:44px;max-width:120px}
 .mini{min-height:40px;font-size:14px;padding:0 12px}
 .scene{height:74px}
}
@media(min-width:900px){html{zoom:1.2}.wrap{max-width:1000px}.top h1{font-size:26px}.scene{height:110px}}
</style>
</head>
<body>
<div id="app" class="wrap" lang="ar" dir="rtl">
  <header class="top">
    <div class="brand"><div class="logo" id="logo"></div><div><h1>المكتب التسويقي لمنصة شحنات</h1><p id="today"></p></div></div>
    <div class="tools" id="tools"></div>
  </header>
  <main id="view" aria-live="polite"></main>
  <section id="crm" hidden></section>
</div>
<div id="sheet" dir="rtl" lang="ar" hidden></div>
<nav class="bar" id="nav" dir="rtl" aria-label="التنقل"></nav>
<div class="toast" id="toast" dir="rtl" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/shim.js"></script>
<script>
(function(){
'use strict';
document.documentElement.lang='ar';
document.documentElement.dir='rtl';

/* ---------- the team ---------- */
var EMPS=[
 {key:'seo',n:'ريم',room:'السيو و GEO',role:'أخصائية السيو و GEO',
  duties:'رفع ظهور موقع shahnat.net في نتائج البحث وفي إجابات محركات الذكاء الاصطناعي (GEO)، بحث الكلمات المفتاحية، تدقيق الصفحات، صفحات الأسئلة الشائعة، البيانات المنظمة (schema)، الروابط الداخلية، وخطة المحتوى التقني.',

function md(src){
  var lines=String(src||'').replace(/\r/g,'').split('\n'),html='',list=null,para=[];
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')}
  function fp(){if(para.length){html+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}}
  function fl(){if(list){html+='</'+list+'>';list=null}}
  for(var i=0;i<lines.length;i++){
    var l=lines[i].replace(/\s+$/,''),m;
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){fp();fl();var lv=Math.min(m[1].length+1,4);html+='<h'+lv+'>'+inl(m[2])+'</h'+lv+'>';continue}
    if(/^\s*[-*•]\s+/.test(l)){fp();if(list!=='ul'){fl();html+='<ul>';list='ul'}html+='<li>'+inl(l.replace(/^\s*[-*•]\s+/,''))+'</li>';continue}
    if(/^\s*\d+[.)]\s+/.test(l)){fp();if(list!=='ol'){fl();html+='<ol>';list='ol'}html+='<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>';continue}
    if(/^-{3,}$/.test(l.trim())){fp();fl();html+='<hr>';continue}
    fl();para.push(l);
  }
  fp();fl();return html;
}

function keepSnap(){
  var m={};
  document.querySelectorAll('[data-keep]').forEach(function(el){
    if(!el.id)return;
    m[el.id]={v:(el.type==='checkbox'||el.type==='radio')?el.checked:el.value,f:document.activeElement===el,s:el.selectionStart,e:el.selectionEnd};
  });
  return m;
}
function keepRestore(m){
  Object.keys(m).forEach(function(id){
    var el=document.getElementById(id);if(!el)return;var x=m[id];
    if(el.type==='checkbox'||el.type==='radio')el.checked=x.v;else el.value=x.v;
    if(x.f){el.focus();try{el.setSelectionRange(x.s,x.e)}catch(_){}}
  });
}

function sortTasks(l){
  var order={review:0,doing:1,'new':2,done:3};
  return l.slice().sort(function(a,b){
    var oa=order[a.status],ob=order[b.status];
    if(oa!==ob)return oa-ob;
    if(a.status==='done')return (a.doneAt||'')<(b.doneAt||'')?1:-1;
    return (a.due||'9')<(b.due||'9')?-1:1;
  });
}

   'القيود: كل نص بالعربية، employees لكل الموظفين الخمسة بمفاتيحهم، gaps وimprove من 2 إلى 4 عناصر، next حتى 6 مهام، priority إما "high" أو "normal".'].join('\n\n');
}
function cleanMeeting(d){
  function s(x,m){return String(x==null?'':x).slice(0,m)}
  function arr(x,m,l){return (Array.isArray(x)?x:[]).slice(0,l).map(function(v){return s(v,m)}).filter(Boolean)}
  d=d||{};
  var emps=(Array.isArray(d.employees)?d.employees:[]).filter(function(r){return r&&EMP[r.key]}).map(function(r){return {key:r.key,report:s(r.report,500),blocker:s(r.blocker,300),idea:s(r.idea,300)}});
  var next=(Array.isArray(d.next)?d.next:[]).filter(function(t){return t&&EMP[t.emp]&&t.title}).slice(0,6).map(function(t){
    var days=Number(t.due_in_days);var due='';
    if(isFinite(days)&&days>=0&&days<=30){var dt=new Date();dt.setDate(dt.getDate()+Math.round(days));due=ymd(dt)}
    return {emp:t.emp,title:s(t.title,140),brief:s(t.brief,700),priority:t.priority==='high'?'high':'normal',due:due};
  });
  return {headline:s(d.headline,240),employees:emps,gaps:arr(d.gaps,320,5),improve:arr(d.improve,320,5),next:next};
}

function addAlert(type,ref,text){return db.collection('alerts').doc().set({type:type,ref:ref||'',text:text,at:now(),read:false}).catch(function(e){console.error(e)})}

function dueRun(t){
  if(!t.auto||t.status!=='new'||!t.due||state.err[t.id])return false;
  var p=t.due.split('-'),tm=(t.dueTime||'08:00').split(':');
  return new Date(+p[0],+p[1]-1,+p[2],+tm[0],+tm[1])<=new Date();
}
function autoRun(){
  if(state.role!=='manager'||!sample||!state.ready.t)return;   /* only the office manager's open page runs scheduled tasks, so two open pages never run the same task twice */
  var c=Object.keys(state.running).length;
  state.tasks.filter(dueRun).forEach(function(t){if(c<2&&!state.running[t.id]){c++;runTask(t.id)}});
}

/* ---------- actions ---------- */
async function runTask(id,note,fb){
  var t=getTask(id,fb);
  if(!t||state.running[id])return;
  if(!sample){toast('تشغيل الموظفين غير متاح في هذا العرض');return}
  var prevStatus=t.output?'review':'new';
  var ctl=new AbortController();
  state.running[id]={text:'',ctl:ctl};state.err[id]='';
  render();
  await patch(id,{status:'doing'});
  try{
    var r=await sample(buildTaskPrompt(t,note),{signal:ctl.signal,cache:false,onText:function(u){
      if(state.running[id])state.running[id].text=u.text;
      var el=document.getElementById('live-'+id);if(el)el.innerHTML=md(u.text);
    }});
    await patch(id,{output:r.text,status:'review',truncated:!!r.truncated,revisions:(t.revisions||0)+(note?1:0),lastRunAt:now()});addAlert('task_ready',id,(EMP[t.emp]||{n:''}).n+' سلّم: '+t.title);
  }catch(e){
    if(e&&e.code!=='cancelled')state.err[id]=sampleErr(e&&e.code);
    await patch(id,{status:prevStatus});
  }finally{
    delete state.running[id];render();
  }
}
async function createTask(){
  var v=function(i){var el=document.getElementById(i);return el?el.value:''};
  var title=v('nt-title').trim();
  if(!title){toast('اكتبي عنوان المهمة');return}
  var go=!!(document.getElementById('nt-go')&&document.getElementById('nt-go').checked&&sample);
  var data={title:title,brief:v('nt-brief').trim(),emp:v('nt-emp'),priority:v('nt-prio')==='high'?'high':'normal',due:v('nt-due')||'',dueTime:v('nt-time')||'08:00',auto:!go&&!!v('nt-due'),
    status:'new',createdAt:now(),updatedAt:now(),output:'',attachments:[],revisions:0};
  if(data.auto){data.prompt=buildTaskPrompt(data,'');data.empName=(EMP[data.emp]||{}).n||''}
  var ref=db.collection('tasks').doc();
  try{await ref.set(data)}catch(e){console.error(e);toast('تعذر حفظ المهمة');return}
  state.view='tasks';
  state.sheet={type:'task',id:ref.id};
  render();
  if(go)runTask(ref.id,'',Object.assign({id:ref.id},data));
}
function addLesson(k,text){
  return enqueue('e'+k,function(){var cur=(state.emps[k]&&state.emps[k].lessons)||[];return db.doc('employees/'+k).set({lessons:cur.concat([text]).slice(-20)})}).catch(function(e){console.error(e);toast('تعذر حفظ التوجيه')});
}
async function uploadFiles(files,id){
  if(!assets||!files.length)return;
  state.uploading=true;render();
  var t=getTask(id),list=((t&&t.attachments)||[]).slice();
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      var r=await assets.upload(f,typeOf(f));
      list.push({id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes,at:now()});
    }catch(e){
      var c=e&&e.code,m={unsupported_type:'الصيغة غير مدعومة: '+f.name,too_large:'الملف أكبر من 20 ميغابايت: '+f.name,quota_or_state:'مساحة المرفقات امتلأت'};
      toast(m[c]||'تعذر رفع '+f.name);
    }
  }
  await patch(id,{attachments:list});
  state.uploading=false;render();
}
function buildMinutes(m,notes){
  var d=m.data||{},L=[];
  L.push('محضر اجتماع المكتب التسويقي لمنصة شحنات');
  L.push('التاريخ: '+fmtLong(m.at));
  L.push('الحضور: المدير التنفيذي، مديرة المكتب التسويقي، '+EMPS.map(function(e){return e.n}).join('، ')+' (الموظفون الأذكياء)');
  if(d.headline)L.push('\nملخص الاجتماع:\n'+d.headline);
  var rep=(d.employees||[]).filter(function(r){return EMP[r.key]});
  if(rep.length){L.push('\nما جرى في الاجتماع (تقارير الفريق):');rep.forEach(function(r){var e=EMP[r.key];L.push('- '+e.n+' ('+e.role+'): '+(r.report||'—')+(r.blocker?' | يعطّله: '+r.blocker:'')+(r.idea?' | فكرة تطوير: '+r.idea:''))})}
  if((d.gaps||[]).length){L.push('\nنقاط التقصير:');d.gaps.forEach(function(x){L.push('- '+x)})}
  if((d.improve||[]).length){L.push('\nنقاط التطوير:');d.improve.forEach(function(x){L.push('- '+x)})}
  if((d.next||[]).length){L.push('\nالمهام المقترحة للأسبوع القادم'+(m.added?' (أُضيفت إلى لوحة المهام)':'')+':');d.next.forEach(function(t){L.push('- '+t.title+' — '+((EMP[t.emp]||{}).n||'؟')+(t.priority==='high'?' (عاجلة)':''))})}
  L.push('\nقرارات وملاحظات المدير التنفيذي:\n'+((notes||'').trim()||'لا توجد ملاحظات مدوّنة.'));
  return L.join('\n');
}
async function startMeeting(){
  if(!sample||state.meet.busy||!state.ceo)return;
  var ctl=new AbortController();
  state.meet={busy:true,err:'',sel:state.meet.sel,ctl:ctl};render();
  try{
    var data=await sample.json(buildMeetingPrompt(),{signal:ctl.signal,cache:false});
    var clean=cleanMeeting(data);
    if(!clean.employees.length&&!clean.next.length)throw {code:'invalid_json'};
    var ref=db.collection('meetings').doc();
    await ref.set({at:now(),data:clean,notes:'',added:false});
    state.meet.sel=ref.id;
  }catch(e){
    if(!(e&&e.code==='cancelled'))state.meet.err=sampleErr(e&&e.code);
  }finally{
    state.meet.busy=false;state.meet.ctl=null;render();
  }
}

    var v=function(i){return (($('#'+i)||{}).value||'').trim()},topic=v('mr-topic'),d=v('mr-date'),tm=v('mr-time');
    var when=(d?fmtShort(d):'')+(tm?' '+tm:'');
    db.collection('alerts').doc().set({type:'meeting_request',ref:'',text:'المدير التنفيذي يطلب اجتماعاً'+(when?' ('+when.trim()+')':'')+(topic?': '+topic:''),at:now(),read:false}).then(function(){['mr-topic','mr-date','mr-time'].forEach(function(i){var e=$('#'+i);if(e)e.value=''});toast('أُرسل طلب الاجتماع إلى مديرة التسويق')}).catch(function(){toast('تعذر إرسال الطلب')});
  },
  meetstart:function(){startMeeting()},
 meetstop:function(){if(state.meet.ctl)state.meet.ctl.abort()},
 meetpick:function(el){state.meet.sel=el.dataset.id;render();window.scrollTo(0,0)},
   minutessend:async function(el){
    var m=state.meetings.filter(function(x){return x.id===el.dataset.id})[0];if(!m)return;
    var ta=$('#mt-notes'),notes=ta?ta.value:(m.notes||'');
    var mn={text:buildMinutes(m,notes),at:now(),by:state.role==='ceo'?'ceo':'manager'};
    try{
      await db.doc('meetings/'+m.id).update({notes:notes,minutes:mn});
      await db.collection('alerts').doc().set({type:'minutes',ref:m.id,text:'محضر اجتماع '+fmtLong(m.at)+' جاهز',at:now(),read:false});
      toast('أُرسل المحضر إلى المدير التنفيذي ومديرة المكتب');
    }catch(_){toast('تعذر إرسال المحضر')}
  },
  minutescopy:function(el){
    var m=state.meetings.filter(function(x){return x.id===el.dataset.id})[0];if(!m||!m.minutes)return;
    try{navigator.clipboard.writeText(m.minutes.text).then(function(){toast('نُسخ المحضر')},function(){toast('تعذر النسخ')})}catch(_){toast('تعذر النسخ')}
  },
  minutesprint:function(el){
    var m=state.meetings.filter(function(x){return x.id===el.dataset.id})[0];if(!m||!m.minutes)return;
    var w=window.open('','_blank');if(!w){toast('اسمحي بالنوافذ المنبثقة للطباعة');return}
    w.document.write('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محضر اجتماع</title><body style="font:18px/1.9 Tahoma,Arial,sans-serif;padding:32px;white-space:pre-wrap">'+esc(m.minutes.text)+'</body></html>');
    w.document.close();w.focus();setTimeout(function(){w.print()},300);
  },
  meetnotes:function(el){
    if(!state.ceo){toast('هذا الإجراء للمدير التنفيذي');return}
   var v=($('#mt-notes')||{}).value||'';
   db.doc('meetings/'+el.dataset.id).update({notes:v}).then(function(){toast('حُفظت الملاحظات')}).catch(function(){toast('تعذر الحفظ')});
 },
 meetadd:async function(el){
    if(!state.mgr){toast('هذا الإجراء لمديرة التسويق');return}
   var m=state.meetings.filter(function(x){return x.id===el.dataset.id})[0];if(!m)return;
   var next=(m.data&&m.data.next)||[],made=0;
   for(var i=0;i<next.length;i++){
     var c=document.getElementById('mt-'+i);if(!c||!c.checked)continue;
     var t=next[i];
     try{await db.collection('tasks').doc().set({title:t.title,brief:t.brief,emp:t.emp,priority:t.priority,due:t.due||'',status:'new',createdAt:now(),updatedAt:now(),output:'',attachments:[],revisions:0});made++}catch(e){console.error(e)}
   }
   if(made){await db.doc('meetings/'+m.id).update({added:true});toast('أُضيفت '+n(made)+' مهام إلى اللوحة')}
   else toast('اختاري مهمة واحدة على الأقل');
 }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=H[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='nt-emp'&&state.sheet&&state.sheet.type==='new'){state.sheet.k=el.value;render()}
  if(el.id==='file-in'&&state.sheet&&state.sheet.type==='task'){var files=Array.prototype.slice.call(el.files||[]);el.value='';uploadFiles(files,state.sheet.id)}
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if(VIEWS.indexOf(h)>=0&&h!==state.view){state.view=h;state.sheet=null;render()}
});

/* ---------- boot ---------- */
var h0=location.hash.replace('#','');if(VIEWS.indexOf(h0)>=0)state.view=h0;
render();
(async function(){
  if(!window.claude||!window.claude.use){render();return}
  try{db=await window.claude.use('db')}catch(_){db=null}
  try{sample=await window.claude.use('sample')}catch(_){sample=null}
  try{assets=await window.claude.use('assets')}catch(_){assets=null}
  try{var user=await window.claude.use('user');state.mgr=user&&user.canEdit?!!user.canEdit():true;state.role=(user&&user.role)||(state.mgr?'manager':'ceo')}catch(_){state.mgr=true;state.role='manager'}
  if(!db){render();return}
  var timer=setTimeout(function(){if(!state.ready.t){state.slow=true;render()}},10000);
  function fail(e){state.dbErr=(e&&e.code)||'error';render()}
  db.collection('tasks').onSnapshot(function(s){
    state.tasks=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    state.ready.t=true;clearTimeout(timer);render();
  },fail);
  db.collection('employees').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=d.data()});state.emps=m;state.ready.e=true;render();
  },fail);
  db.collection('meetings').onSnapshot(function(s){
    state.meetings=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});state.ready.m=true;render();
  },fail);
  if(state.mgr){
    db.collection('notes').onSnapshot(function(s){state.notes=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},fail);
    db.collection('alerts').onSnapshot(function(s){
      var list=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      if(alertsReady)list.forEach(function(a){if(!a.read&&!alertIds[a.id])notify(a)});
      alertIds={};list.forEach(function(a){alertIds[a.id]=1});
      state.alerts=list;alertsReady=true;render();
    },fail);
  }
  if(!state.mgr){
    var seenMin=null;
    db.collection('alerts').onSnapshot(function(s){
      var ids={};s.docs.forEach(function(d){ids[d.id]=d.data()});
      if(seenMin){Object.keys(ids).forEach(function(k){if(!seenMin[k]&&ids[k].type==='minutes'&&ids[k].text)notify(ids[k])})}
      seenMin=Object.keys(ids).reduce(function(o,k){o[k]=1;return o},{});
    },fail);
  }
  db.doc('config/company').onSnapshot(function(d){
    state.company=d.exists?String((d.data()||{}).text||''):'';state.ready.c=true;render();
  },fail);
  setInterval(autoRun,60000);setTimeout(autoRun,2500);
})();
})();
</script>
